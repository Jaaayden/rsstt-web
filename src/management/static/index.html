<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />
        <meta name="description" content="RSStT Web — manage RSS feeds, Telegram chats and deliveries." />
        <title>RSStT Web</title>
        <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/assets/app.css" />
        <!-- Everything the app needs is requested at once instead of one import level at a time. -->
        <link rel="modulepreload" href="/assets/vendor-preact.js" />
        <link rel="modulepreload" href="/assets/core.js" />
        <link rel="modulepreload" href="/assets/error-messages.js" />
        <link rel="modulepreload" href="/assets/ui.js" />
        <link rel="modulepreload" href="/assets/options.js" />
        <link rel="modulepreload" href="/assets/proxy.js" />
        <link rel="modulepreload" href="/assets/page-overview.js" />
        <link rel="modulepreload" href="/assets/page-chats.js" />
        <link rel="modulepreload" href="/assets/page-subscriptions.js" />
        <link rel="modulepreload" href="/assets/page-logs.js" />
        <link rel="modulepreload" href="/assets/page-settings.js" />
        <link rel="preload" as="fetch" href="/api/public" crossorigin />
        <link rel="preload" as="fetch" href="/api/session" crossorigin />
        <script type="module" src="/assets/app.js"></script>
    </head>
    <body>
        <div id="app"><div class="boot"></div></div>
    </body>
</html>
