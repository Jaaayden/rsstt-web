name: Bot compatibility
on:
  pull_request:
  push:
    branches: [dev, main, 'integration/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  TOKEN: test
  MANAGER: '1'
  MULTIPROCESSING: '0'
  WEB_ENABLED: '0'
  TABLE_TO_IMAGE: '1'
jobs:
  startup:
    name: Bot Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.9', os: ubuntu-latest}
          - {python: '3.10', os: ubuntu-latest}
          - {python: '3.11', os: ubuntu-latest}
          - {python: '3.12', os: ubuntu-latest}
          - {python: '3.13', os: ubuntu-latest}
          - {python: '3.13', os: macos-15}
          - {python: '3.13', os: windows-latest}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/ci_bot_smoke.py
  postgres:
    name: PostgreSQL and legacy migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned Aerich 0.6 fixture
        uses: actions/checkout@v7
        with:
          repository: Rongronggg9/RSS-to-Telegram-Bot
          ref: ceb602209a629b8595c03d94a42e49c1a2b46084
          path: legacy-fixture
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: legacy-fixture/requirements.txt
      - name: Prepare legacy interpreter
        shell: bash
        run: |
          python -m venv .legacy-venv
          .legacy-venv/bin/python -m pip install -r legacy-fixture/requirements.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Upgrade legacy SQLite and PostgreSQL databases
        run: >-
          python scripts/ci_legacy_migrations.py
          --legacy-python .legacy-venv/bin/python
          --legacy-source legacy-fixture
          --postgres postgres://test:test@127.0.0.1:5432/test
