name: Docker build
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose.testing.yaml'
      - '.env.testing.example'
      - '.dockerignore'
      - 'requirements.txt'
      - 'setup.*'
      - 'src/**'
      - 'scripts/health_check.py'
      - 'scripts/stress_resources.py'
      - 'scripts/ci_resource_probe.py'
      - '.github/workflows/pr-test-docker-build.yml'
      - 'scripts/ci_docker_context.py'
  push:
    branches: [main, 'integration/**']
    paths:
      - 'Dockerfile'
      - 'compose.testing.yaml'
      - '.env.testing.example'
      - '.dockerignore'
      - 'requirements.txt'
      - 'setup.*'
      - 'src/**'
      - 'scripts/health_check.py'
      - 'scripts/stress_resources.py'
      - 'scripts/ci_resource_probe.py'
      - '.github/workflows/pr-test-docker-build.yml'
      - 'scripts/ci_docker_context.py'
  workflow_dispatch:
    inputs:
      stable_rounds:
        description: Stable-set resource probe rounds (churn always runs 60)
        type: choice
        default: '60'
        options: ['60', '300']
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Docker amd64 build and offline import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Validate isolated online test configuration
        env:
          TEST_BOT_TOKEN: test-placeholder-only
          TEST_MANAGER_ID: '1'
          TEST_WEB_PASSWORD: ci-validation-password-only
        run: docker compose -p rsstt-web-test --env-file /dev/null -f compose.testing.yaml config --quiet
      - name: Check resource probe applicability
        id: resource
        shell: bash
        env:
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -f scripts/stress_resources.py ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            case "$CI_BRANCH" in
              feat/console-bot-performance|integration/*)
                echo '::error::Resource probe is required for performance and integration branches.'
                exit 1
                ;;
              *)
                echo 'available=false' >> "$GITHUB_OUTPUT"
                echo '::notice::Resource probe is not applicable: this foundation/feature does not include the probe script.'
                echo 'Resource probe: not applicable (probe script is absent from this foundation/feature).' >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          fi
      - name: Verify private files stay outside Docker context
        run: python scripts/ci_docker_context.py
      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          tags: rsstt-web:ci
          context: .
          platforms: linux/amd64
          build-args: EXP_DEPS=0
          cache-from: type=gha,scope=console-docker
          cache-to: type=gha,scope=console-docker,mode=max
      - name: Verify Web modules and assets without network
        run: >-
          docker run --rm --network none --entrypoint python
          -e TOKEN=test -e MANAGER=1 -e MULTIPROCESSING=0
          rsstt-web:ci -c
          "from pathlib import Path; from src.management.server import create_app;
          assert Path('src/management/static/index.html').is_file();
          assert Path('src/management/static/app.js').is_file()"
      - name: Offline 1 CPU / 512 MiB resource probe
        if: steps.resource.outputs.available == 'true'
        env:
          RESOURCE_STABLE_ROUNDS: ${{ inputs.stable_rounds || '60' }}
        run: python scripts/ci_resource_probe.py --stable-rounds "$RESOURCE_STABLE_ROUNDS"
      - name: Upload resource evidence (including failed runs)
        if: always() && steps.resource.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: resource-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/resource
          retention-days: 14
