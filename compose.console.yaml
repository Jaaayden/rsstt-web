# Prebuilt image from GitHub Actions; no build on the server.
# Pin a version for production, e.g. RSSTT_WEB_IMAGE=ghcr.io/jaaayden/rsstt-web:sha-abc1234
# To build locally instead: docker build -t rsstt-web:local . && RSSTT_WEB_IMAGE=rsstt-web:local
services:
  rsstt:
    image: ${RSSTT_WEB_IMAGE:-ghcr.io/jaaayden/rsstt-web:latest}
    restart: unless-stopped
    environment:
      TOKEN: ${TOKEN:?Set the Telegram bot TOKEN}
      MANAGER: ${MANAGER:?Set the Telegram MANAGER ID}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
      WEB_ENABLED: "1"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8730"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:8730}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set a console password of at least 16 characters}
    ports:
      - "127.0.0.1:8730:8730"
    volumes:
      - ./config:/app/config
