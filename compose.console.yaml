# RSStT Web: the bot and its web console in one prebuilt image (no build on your server).
# Put your settings in .env next to this file; see https://jaaayden.github.io/rsstt-web/
#   docker compose up -d
# Pin an exact version in .env for production, e.g. RSSTT_WEB_IMAGE=ghcr.io/jaaayden/rsstt-web:1.0.0
services:
  rsstt:
    image: ${RSSTT_WEB_IMAGE:-ghcr.io/jaaayden/rsstt-web:1}
    container_name: rsstt-web
    restart: unless-stopped
    # Every variable in .env reaches the bot (TELEGRAPH_TOKEN, MULTIUSER, proxies, ...).
    env_file: .env
    environment:
      TOKEN: ${TOKEN:?Set TOKEN (from @BotFather) in .env}
      MANAGER: ${MANAGER:?Set MANAGER (your Telegram user ID) in .env}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD (16+ characters) in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:8730}
      WEB_ENABLED: "1"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8730"
    ports:
      # Only reachable from the server itself; use a reverse proxy (HTTPS) or an SSH tunnel.
      - "127.0.0.1:${WEB_PUBLISH_PORT:-8730}:8730"
    volumes:
      - ./config:/app/config
